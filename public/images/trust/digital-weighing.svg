<!-- PLACEHOLDER - trust banner illustration (digital weighing scale).
     Replace with the real 3D render at the same ~4:3 landscape ratio. -->
<svg width="480" height="360" viewBox="0 0 480 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="platform" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#4B5563"/>
      <stop offset="1" stop-color="#1F2937"/>
    </linearGradient>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#374151"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="obj" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E5E7EB"/>
    </linearGradient>
  </defs>

  <!-- Ground shadow -->
  <ellipse cx="240" cy="316" rx="150" ry="16" fill="#15803D" opacity="0.12"/>

  <!-- Items being weighed -->
  <g>
    <!-- Carton -->
    <path d="M104 148 L152 130 L200 148 L200 210 L152 228 L104 210 Z" fill="#EADFC8"/>
    <path d="M104 148 L152 166 L200 148" stroke="#D6C6A6" stroke-width="3" fill="none" stroke-linejoin="round"/>
    <path d="M152 166 L152 228" stroke="#D6C6A6" stroke-width="3" fill="none"/>
    <rect x="140" y="136" width="24" height="70" rx="3" fill="#BBF7D0" opacity="0.85" transform="rotate(-2 152 171)"/>

    <!-- Bottle -->
    <rect x="228" y="96" width="22" height="16" rx="4" fill="#374151"/>
    <path d="M226 112 h26 a16 16 0 0 1 16 16 v76 a12 12 0 0 1 -12 12 h-34 a12 12 0 0 1 -12 -12 v-76 a16 16 0 0 1 16 -16 z" fill="#DBEAFE" opacity="0.9"/>
    <rect x="214" y="150" width="54" height="26" rx="5" fill="#BBF7D0"/>

    <!-- Metal offcut -->
    <g transform="translate(292 150) rotate(-6 44 34)">
      <rect x="0" y="0" width="88" height="14" rx="4" fill="url(#obj)"/>
      <rect x="36" y="12" width="16" height="42" fill="#D1D5DB"/>
      <rect x="0" y="52" width="88" height="14" rx="4" fill="url(#obj)"/>
    </g>
  </g>

  <!-- Scale platform -->
  <rect x="88" y="226" width="304" height="24" rx="10" fill="url(#platform)"/>
  <rect x="88" y="226" width="304" height="8" rx="4" fill="#6B7280" opacity="0.6"/>

  <!-- Scale base -->
  <rect x="104" y="248" width="272" height="56" rx="16" fill="url(#base)"/>

  <!-- Digital display -->
  <rect x="286" y="262" width="76" height="28" rx="8" fill="#052E16"/>
  <g fill="#4ADE80">
    <rect x="296" y="270" width="10" height="12" rx="2"/>
    <rect x="310" y="270" width="10" height="12" rx="2"/>
    <rect x="328" y="270" width="10" height="12" rx="2"/>
    <rect x="342" y="270" width="10" height="12" rx="2"/>
  </g>
  <circle cx="322" cy="288" r="1.6" fill="#4ADE80"/>

  <!-- Indicator lights -->
  <circle cx="130" cy="276" r="6" fill="#22C55E"/>
  <circle cx="150" cy="276" r="6" fill="#374151"/>

  <!-- Accuracy tick -->
  <g transform="translate(372 84)">
    <circle cx="30" cy="30" r="30" fill="#22C55E"/>
    <path d="M18 31 l8 8 l16 -18" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
</svg>
